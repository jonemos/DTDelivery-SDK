<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DT Delivery Viewer</title>  <script type="module" crossorigin src="./assets/index-BR9in8h4.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BEiNJqYd.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-heading">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7Z M3 7l9 5 9-5 M12 12v10"/></svg><strong>DT Delivery <span class="brand-caption">Viewer</span></strong><span class="version-badge">SDK <span id="version"></span></span></div>
      <span id="status" class="status-label" role="status" aria-live="polite">청크 폴더를 선택하세요.</span>
      <details class="connection-help"><summary>연결 안내</summary><p id="source-help">전체/변경분 저장 폴더 또는 로컬 게시 저장소를 선택하세요.</p></details>
    </div>
    <div class="toolbar-controls">
    <div class="connection-controls">
      <label class="source-field"><span>청크 위치</span><select id="source"><option value="local">로컬 청크 폴더</option><option value="http">정적 청크 주소</option><option value="publication">원격 게시 저장소</option></select></label>
      <button id="folder" class="button-secondary">청크 폴더 선택</button>
      <label class="address-field" id="address-field" hidden><span>청크 주소</span><input id="address" aria-label="청크 폴더 주소" placeholder="https://example.com/chunks/" spellcheck="false"></label>
      <label class="scope-field"><span>게시 구역</span><input id="scope" value="development" spellcheck="false"></label>
      <label class="address-field" id="publication-field" hidden><span>통합레벨 ID</span><input id="publication-id" aria-label="원격 통합레벨 ID" placeholder="편집기의 통합레벨 ID" spellcheck="false"></label>
      <button id="list" class="button-secondary">목록 조회</button>
    </div>
    <div class="model-controls"><label class="model-field"><span>통합레벨</span><select id="models" disabled></select></label><button id="open" class="button-primary" disabled>게시본 열기</button><button id="close" class="button-quiet">연결 해제</button></div>
    </div>
  </header>
  <main class="viewer-layout">
    <aside class="viewer-outliner" aria-label="통합레벨 아웃라이너"><section id="examples" class="feature-lab" aria-label="기능별 실행 예제"></section><div class="panel-heading"><span class="panel-kicker">SCENE</span><h2>아웃라이너</h2></div><div id="actors"></div></aside>
    <section id="viewport" aria-label="통합레벨 뷰포트"><div id="viewport-tools"></div><canvas id="view"></canvas></section>
    <aside class="viewer-details" aria-label="모델 상세"><section id="example-code-panel" class="example-code-panel" aria-label="예제 코드와 결과" hidden></section><div id="viewer-information"><section class="panel-section load-section" aria-label="실시간 로드 진행"><div class="section-heading"><h2>로드 진행</h2><span id="load-summary" class="count-label">대기 중</span></div><progress id="load-progress" aria-label="준비된 화면 청크" max="1" value="0"></progress><ul id="load-states"></ul></section><section class="panel-section"><div class="section-heading"><h2>선택 액터</h2></div><div id="actor-details"></div></section><section class="panel-section"><div class="section-heading"><h2>스크립트 공개 속성</h2></div><div id="scripts">로드된 스크립트가 없습니다.</div></section></div></aside>
  </main>
</body></html>
