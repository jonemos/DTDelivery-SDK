<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DT SDK 외부 프로젝트 예제</title>
</head>
<body>
  <header>
    <strong>DT Delivery SDK <span id="version"></span></strong>
    <label>청크 위치
      <select id="source" aria-describedby="source-help">
        <option value="local">로컬 폴더</option>
        <option value="remote">원격 저장소</option>
      </select>
    </label>
    <label>조회 API 주소<input id="api" type="url" value="http://127.0.0.1:18849/" spellcheck="false"></label>
    <label>API 토큰<input id="token" type="password" autocomplete="off" aria-describedby="source-help"></label>
    <label>게시 구역(scope)<input id="scope" value="development" spellcheck="false"></label>
    <button id="list">목록 조회</button>
    <select id="models" aria-label="통합레벨" disabled></select>
    <button id="open" disabled>게시본 열기</button>
    <button id="close">연결 해제</button>
    <p id="source-help"></p>
    <span id="status" role="status">API 토큰을 입력한 뒤 목록 조회를 누르세요.</span>
  </header>
  <main><canvas id="view"></canvas></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
