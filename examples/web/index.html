<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DT SDK 외부 프로젝트 예제</title>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-heading">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 3 12 7v14l-12 7-12-7V10L16 3Z M4 10l12 7 12-7 M16 17v14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <strong>DT Delivery <span class="brand-caption">Viewer</span></strong>
        <span class="version-badge">SDK <span id="version"></span></span>
      </div>
      <span class="workflow">API 연결 <span aria-hidden="true">→</span> 목록 조회 <span aria-hidden="true">→</span> 모델 열기</span>
    </div>
    <div class="connection-controls" role="group" aria-label="API 연결 설정">
      <label class="source-field">청크 위치
        <select id="source" aria-describedby="source-help">
          <option value="local">로컬 폴더</option>
          <option value="remote">원격 저장소</option>
        </select>
      </label>
      <label class="api-field">조회 API 주소<input id="api" type="url" value="http://127.0.0.1:18849/" spellcheck="false"></label>
      <label class="token-field">API 토큰<input id="token" type="password" autocomplete="off" aria-describedby="source-help"></label>
      <label class="scope-field">게시 구역 <span class="label-detail">(scope)</span><input id="scope" value="development" spellcheck="false"></label>
      <button id="list" class="button-secondary">목록 조회</button>
    </div>
    <div class="model-controls" role="group" aria-label="모델 열기">
      <label class="model-field"><span>통합레벨</span><select id="models" disabled></select></label>
      <button id="open" class="button-primary" disabled>게시본 열기 <span aria-hidden="true">↗</span></button>
      <button id="close" class="button-quiet">연결 해제</button>
    </div>
    <div class="toolbar-footer">
      <details class="connection-help">
        <summary>실행 안내</summary>
        <p id="source-help"></p>
      </details>
      <span id="status" role="status">API 연결 정보를 확인하고 있습니다…</span>
    </div>
  </header>
  <main><canvas id="view"></canvas></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
