<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DT Delivery Viewer</title></head>
<body>
  <header class="toolbar">
    <div class="toolbar-heading"><div class="brand"><strong>DT Delivery <span class="brand-caption">Viewer</span></strong><span class="version-badge">SDK <span id="version"></span></span></div><span class="workflow">청크 연결 → 목록 조회 → 모델 열기</span></div>
    <div class="connection-controls">
      <label>청크 위치<select id="source"><option value="local">로컬 청크 폴더</option><option value="http">정적 청크 주소</option></select></label>
      <button id="folder" class="button-secondary">청크 폴더 선택</button>
      <label class="address-field" id="address-field" hidden>청크 폴더 주소<input id="address" placeholder="https://example.com/chunks/" spellcheck="false"></label>
      <label class="scope-field">게시 구역<input id="scope" value="development" spellcheck="false"></label>
      <button id="list" class="button-secondary">목록 조회</button>
    </div>
    <div class="model-controls"><label class="model-field">통합레벨<select id="models" disabled></select></label><button id="open" class="button-primary" disabled>게시본 열기</button><button id="close" class="button-quiet">연결 해제</button></div>
    <div class="toolbar-footer"><span id="source-help">전체/변경분 저장 폴더 또는 로컬 게시 저장소를 선택하세요.</span><span id="status" role="status">청크 폴더를 선택하세요.</span></div>
  </header>
  <main class="viewer-layout">
    <aside class="viewer-outliner" aria-label="통합레벨 아웃라이너"><h2>통합레벨 아웃라이너</h2><div id="actors"></div></aside>
    <section id="viewport" aria-label="통합레벨 뷰포트"><div id="viewport-tools"></div><canvas id="view"></canvas></section>
    <aside class="viewer-details"><section aria-label="실시간 로드 진행"><h2>실시간 로드 진행</h2><progress id="load-progress" aria-label="준비된 화면 청크" max="1" value="0"></progress><ul id="load-states"></ul></section><div id="actor-details"></div><section><h2>스크립트 공개 속성</h2><div id="scripts">로드된 스크립트가 없습니다.</div></section></aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body></html>
